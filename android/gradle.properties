# ===============================
# Increase Gradle performance
# ===============================

# Use more RAM for faster builds
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC

# Enable parallel project execution
org.gradle.parallel=true

# Enable configuration on demand
org.gradle.configureondemand=true

# Reuse classpath structure for faster incremental builds
org.gradle.caching=true

# Use AndroidX
android.useAndroidX=true
android.enableJetifier=true
# AGP 9's built-in Kotlin support and new DSL aren't yet supported by this
# Flutter version's Gradle plugin, so use the classic Kotlin Gradle Plugin instead.
android.builtInKotlin=false

# Kotlin incremental builds
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.incremental.useClasspathSnapshot=true

# Enable Gradle daemon
org.gradle.daemon=true

# Enable incremental dexing
android.enableDexingArtifactTransform=true

# Faster resource merging
android.nonTransitiveRClass=true
android.newDsl=false
